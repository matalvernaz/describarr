services:
  describarr:
    image: ghcr.io/matalvernaz/describarr:latest
    container_name: describarr
    environment:
      - AUDIOVAULT_EMAIL=${AUDIOVAULT_EMAIL}
      - AUDIOVAULT_PASSWORD=${AUDIOVAULT_PASSWORD}
      - DESCRIBARR_MIN_SCORE=${DESCRIBARR_MIN_SCORE:-65}
      # Run the daily-limit reset and overnight drain on local time, not UTC.
      - TZ=${TZ:-America/Vancouver}
      # Optional: per-episode Pushover notification when describarr finishes.
      # Leave unset to disable.
      - PUSHOVER_TOKEN=${PUSHOVER_TOKEN:-}
      - PUSHOVER_USER=${PUSHOVER_USER:-}
    volumes:
      # Mount the same media paths that Sonarr/Radarr use inside their containers.
      # These must match the container-side paths exactly (e.g. /tv, /movies).
      - /path/to/tv:/tv
      - /path/to/movies:/movies
      # Persist the download cache and done-episode tracking across rebuilds.
      # Without this, every image rebuild wipes the cache and done files,
      # causing the retry endpoint to re-process already-merged episodes.
      - /path/to/describarr-cache:/root/.cache/describarr
    networks:
      - arr-network   # must be the same network as Sonarr/Radarr
    restart: unless-stopped
    # No published port and no reverse-proxy labels needed: Sonarr/Radarr reach
    # describarr by name on the shared network (http://describarr:8686). To open
    # the /status dashboard in a browser, add a `ports:` mapping or front it with
    # your own reverse proxy — but the mutating endpoints (/hook, /retry, /drain,
    # DELETE /queue) are unauthenticated unless you set DESCRIBARR_API_KEY, so
    # don't expose it unprotected.

networks:
  arr-network:
    external: true
